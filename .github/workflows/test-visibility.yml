name: Test Visibility

on:
  pull_request:
  push:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Spotless Check
        run: |
          chmod +x gradlew
          ./gradlew spotlessCheck

      - name: Run Tests & Generate Coverage Report
        run: |
          echo "Running tests. Detailed logs are uploaded as an artifact."
          chmod +x gradlew
          ./gradlew test jacocoTestReport -x jacocoTestCoverageVerification --stacktrace > test-output.log 2>&1 || (echo "Tests failed. Check test-output.log." && cat test-output.log && exit 1)
          echo "Tests passed."
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Upload Test Logs And Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-and-reports
          path: |
            test-output.log
            build/reports/jacoco/test/
            build/test-results/
          retention-days: 30

      - name: Comment Coverage Report On PR
        if: github.event_name == 'pull_request'
        id: jacoco
        uses: madrapps/jacoco-report@v1.2
        with:
          title: Test Coverage Report
          paths: ${{ github.workspace }}/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 50
          min-coverage-changed-files: 50
